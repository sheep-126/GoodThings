<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录注册 - 四季穿搭</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="logo">四季穿搭</div>
      <nav class="nav-links">
        <a href="index.html" class="nav-link" data-page="index">首页</a>
        <a href="wardrobe.html" class="nav-link" data-page="wardrobe">穿搭库</a>
        <a href="quiz.html" class="nav-link" data-page="quiz">风格测试</a>
        <a href="profile.html" class="nav-link" data-page="profile">我的</a>
        <a href="admin.html" class="nav-link admin-only" data-page="admin" style="display:none">后台管理</a>
      </nav>
      <div class="nav-right">
        <a href="cart.html" class="btn btn-outline btn-sm">购物车</a>
        <a href="login.html" class="btn btn-primary btn-sm" id="navLoginBtn">登录</a>
        <span class="user-name" id="navUser" style="display:none"></span>
      </div>
    </div>
  </header>

  <section class="section">
    <div class="container auth-box">
      <div class="tabs">
        <button class="tab active" data-tab="login">登录</button>
        <button class="tab" data-tab="register">注册</button>
      </div>

      <!-- 登录表单 -->
      <form id="loginForm" class="auth-form">
        <label>用户名
          <input type="text" id="loginUsername" placeholder="请输入用户名" autocomplete="username">
        </label>
        <label>密码
          <input type="password" id="loginPassword" placeholder="请输入密码" autocomplete="current-password">
        </label>
        <button type="submit" class="btn btn-primary btn-block">登 录</button>
        <p class="tip">测试账号：admin / 123456（管理员）、stu01 / 123456（普通用户）</p>
      </form>

      <!-- 注册表单 -->
      <form id="registerForm" class="auth-form" style="display:none">
        <label>用户名
          <input type="text" id="regUsername" placeholder="请输入用户名（唯一）" autocomplete="username">
        </label>
        <label>密码
          <input type="password" id="regPassword" placeholder="至少 6 位" autocomplete="new-password">
        </label>
        <label>确认密码
          <input type="password" id="regPassword2" placeholder="再次输入密码" autocomplete="new-password">
        </label>
        <label>昵称（可选）
          <input type="text" id="regNickname" placeholder="请输入昵称">
        </label>
        <button type="submit" class="btn btn-success btn-block">注 册</button>
      </form>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <p>季节风格穿搭测试 + 模拟穿搭选购系统 · 课程设计（Flask + 原生三件套 + MySQL）</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
