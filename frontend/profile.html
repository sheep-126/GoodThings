<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人中心 - 四季穿搭</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="logo">四季穿搭</div>
      <nav class="nav-links">
        <a href="index.html" class="nav-link" data-page="index">首页</a>
        <a href="wardrobe.html" class="nav-link" data-page="wardrobe">穿搭库</a>
        <a href="quiz.html" class="nav-link" data-page="quiz">风格测试</a>
        <a href="profile.html" class="nav-link active" data-page="profile">我的</a>
        <a href="admin.html" class="nav-link admin-only" data-page="admin" style="display:none">后台管理</a>
      </nav>
      <div class="nav-right">
        <a href="cart.html" class="btn btn-outline btn-sm">购物车</a>
        <a href="login.html" class="btn btn-primary btn-sm" id="navLoginBtn">登录</a>
        <span class="user-name" id="navUser" style="display:none"></span>
      </div>
    </div>
  </header>

  <section class="section">
    <div class="container profile-box">
      <div class="profile-head" id="profileHead">
        <!-- 由 js/profile.js 渲染用户信息 -->
      </div>

      <div class="profile-entries">
        <a class="entry" href="quiz.html#records">我的测试记录</a>
        <a class="entry" href="wardrobe.html?fav=1">我的收藏</a>
        <a class="entry" href="orders.html">我的订单</a>
      </div>

      <h2 class="section-title">最近测试记录</h2>
      <div class="table-wrap">
        <table class="table" id="recordsTable">
          <thead>
            <tr>
              <th>测试时间</th>
              <th>春</th>
              <th>夏</th>
              <th>秋</th>
              <th>冬</th>
              <th>最终季型</th>
            </tr>
          </thead>
          <tbody id="recordsBody">
            <!-- 由 js/profile.js 动态渲染 -->
          </tbody>
        </table>
      </div>

      <div class="center" style="margin-top:20px">
        <button class="btn btn-outline" id="logoutBtn">退出登录</button>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <p>季节风格穿搭测试 + 模拟穿搭选购系统 · 课程设计（Flask + 原生三件套 + MySQL）</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
