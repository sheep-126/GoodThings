<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后台管理 - 四季穿搭</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="logo">四季穿搭</div>
      <nav class="nav-links">
        <a href="index.html" class="nav-link" data-page="index">首页</a>
        <a href="wardrobe.html" class="nav-link" data-page="wardrobe">穿搭库</a>
        <a href="quiz.html" class="nav-link" data-page="quiz">风格测试</a>
        <a href="profile.html" class="nav-link" data-page="profile">我的</a>
        <a href="admin.html" class="nav-link active admin-only" data-page="admin" style="display:none">后台管理</a>
      </nav>
      <div class="nav-right">
        <a href="cart.html" class="btn btn-outline btn-sm">购物车</a>
        <a href="login.html" class="btn btn-primary btn-sm" id="navLoginBtn">登录</a>
        <span class="user-name" id="navUser" style="display:none"></span>
      </div>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <h2 class="section-title">后台管理（仅管理员）</h2>
      <div class="tabs">
        <button class="tab active" data-tab="questions">题目管理</button>
        <button class="tab" data-tab="products">商品管理</button>
        <button class="tab" data-tab="orders">订单管理</button>
      </div>

      <!-- 题目管理 -->
      <div id="tab-questions" class="tab-panel">
        <div class="toolbar">
          <button class="btn btn-primary" id="addQuestionBtn">新增题目</button>
        </div>
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr><th>题号</th><th>题目内容</th><th>选项数</th><th>操作</th></tr>
            </thead>
            <tbody id="questionBody"></tbody>
          </table>
        </div>
      </div>

      <!-- 商品管理 -->
      <div id="tab-products" class="tab-panel" style="display:none">
        <div class="toolbar">
          <button class="btn btn-primary" id="addProductBtn">新增商品</button>
        </div>
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr><th>ID</th><th>名称</th><th>分类</th><th>价格</th><th>库存</th><th>季型</th><th>场景</th><th>类型</th><th>操作</th></tr>
            </thead>
            <tbody id="productBody"></tbody>
          </table>
        </div>
      </div>

      <!-- 订单管理 -->
      <div id="tab-orders" class="tab-panel" style="display:none">
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr><th>订单号</th><th>用户</th><th>时间</th><th>金额</th><th>状态</th><th>修改状态</th></tr>
            </thead>
            <tbody id="orderBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>

  <!-- 弹窗：题目 / 商品表单（由 js/admin.js 填充） -->
  <div class="modal-mask" id="modalMask" style="display:none">
    <div class="modal" id="modalBox">
      <h3 id="modalTitle">表单</h3>
      <div id="modalForm"></div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="modalOk">保存</button>
        <button class="btn btn-outline" id="modalCancel">取消</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>季节风格穿搭测试 + 模拟穿搭选购系统 · 课程设计（Flask + 原生三件套 + MySQL）</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
