<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>风格测试 - 四季穿搭</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="logo">四季穿搭</div>
      <nav class="nav-links">
        <a href="index.html" class="nav-link" data-page="index">首页</a>
        <a href="wardrobe.html" class="nav-link" data-page="wardrobe">穿搭库</a>
        <a href="quiz.html" class="nav-link active" data-page="quiz">风格测试</a>
        <a href="profile.html" class="nav-link" data-page="profile">我的</a>
        <a href="admin.html" class="nav-link admin-only" data-page="admin" style="display:none">后台管理</a>
      </nav>
      <div class="nav-right">
        <a href="cart.html" class="btn btn-outline btn-sm">购物车</a>
        <a href="login.html" class="btn btn-primary btn-sm" id="navLoginBtn">登录</a>
        <span class="user-name" id="navUser" style="display:none"></span>
      </div>
    </div>
  </header>

  <section class="section">
    <div class="container quiz-container">
      <div class="quiz-progress" id="quizProgress">题目 1 / 10</div>
      <h2 class="quiz-title" id="quizTitle"></h2>
      <div class="quiz-options" id="quizOptions">
        <!-- 选项由 js/quiz.js 动态渲染 -->
      </div>
      <div class="quiz-actions">
        <button class="btn btn-outline" id="prevBtn" disabled>上一题</button>
        <button class="btn btn-primary" id="nextBtn">下一题</button>
        <button class="btn btn-success" id="submitBtn" style="display:none">提交</button>
      </div>
      <p class="tip">共 10 题，每道题请选择最符合你的一个选项，做完提交即可得到你的四季风格。</p>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <p>季节风格穿搭测试 + 模拟穿搭选购系统 · 课程设计（Flask + 原生三件套 + MySQL）</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
